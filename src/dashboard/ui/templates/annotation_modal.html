<!-- AI-Generated Template -->
<div id="annotation_modal" class="annotation-modal">
  <div class="annotation-modal-shell">
    <div class="annotation-toolbar">
      <div class="annotation-identity"><div id="annotation_title" class="annotation-title"></div><div id="annotation_frame_id" class="annotation-frame-id"></div></div>
      <button id="annotation_prev" type="button" class="btn btn-default annotation-round-button" aria-label="Previous frame" title="Previous frame">{{previous_icon}}</button>
      <button id="annotation_next" type="button" class="btn btn-default annotation-round-button" aria-label="Next frame" title="Next frame">{{next_icon}}</button>
      <select id="annotation_species" class="form-control" aria-label="Species">{{species_options}}</select>
      <button id="annotation_delete" type="button" class="btn btn-default">Delete bbox</button>
      <button id="annotation_close" type="button" class="btn btn-default annotation-round-button annotation-close" aria-label="Close annotator" title="Close annotator">{{close_icon}}</button>
    </div>
    <div class="annotation-stage"><img id="annotation_image" class="annotation-image" alt="Camera frame"></div>
  </div>
</div>
