name: CI

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: sentinel_db
          POSTGRES_USER: sentinel_user
          POSTGRES_PASSWORD: sentinel_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sentinel_user -d sentinel_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4"

      - name: Install Python dependencies
        run: pip install -e ".[dev]"

      - name: Install R system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libpq-dev \
            libssl-dev \
            libuv1-dev

      - name: Install R dependencies
        run: Rscript install.R

      - name: Initialize database schema
        run: python src/dashboard/init_db.py
        env:
          DATABASE_URL: postgresql+psycopg://sentinel_user:sentinel_pass@localhost:5432/sentinel_db

      - name: Run Python pytest
        run: pytest --cov --cov-branch --cov-report=xml:coverage-python.xml

        env:
          TESTCONTAINERS_RYUK_DISABLED: true

      - name: Run R tests with coverage
        run: |
          Rscript -e '
            library(covr)
            library(testthat)
            cov <- file_coverage(
              "src/dashboard/R/db.R",
              test_files = "tests/testthat/test-db.R"
            )
            to_cobertura(cov, filename = "coverage-r.xml")
          '
        env:
          POSTGRES_DB: sentinel_db
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: sentinel_user
          POSTGRES_PASSWORD: sentinel_pass

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: ssciwr/sentinel-rat-dashboard
          files: coverage-python.xml,coverage-r.xml
